[package]
name = "actionqueue-actor"
authors = ["Keith <zed.colonel@gmail.com>"]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Remote actor registration, heartbeat monitoring, and executor trait routing for the ActionQueue task queue engine."
readme = "README.md"
repository = "https://github.com/zed-colonel/actionqueue"
keywords = ["actor", "heartbeat", "executor-trait", "task-queue", "routing"]
categories = ["concurrency"]

[dependencies]
actionqueue-core = { version = "0.2.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
