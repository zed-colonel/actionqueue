name: CI

on:
  push:
    branches:
      - main
      - master
      - aq-cont-1
  pull_request:
    branches:
      - main
      - master
      - aq-cont-1

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain for clippy
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: clippy

      - name: Install nightly Rust toolchain for rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all --all-targets -- -D warnings

      # Tests use spawn_blocking with thread::sleep handlers. On CI runners
      # (2 vCPUs), parallel test execution saturates the blocking thread pool
      # and causes intermittent hangs. Serialize tests within each binary.
      - name: Run tests
        run: cargo test --workspace --no-fail-fast -- --test-threads=1

      - name: AQ-CONT-1 contract boundary and frozen-evidence checks
        run: cargo aq-conformance

      - name: Run actionqueue-core serde roundtrip tests
        run: cargo test -p actionqueue-core --features serde

      - name: Run clippy with workflow feature
        run: cargo clippy --all --all-targets --features workflow -- -D warnings

      - name: Run tests with workflow feature
        run: cargo test --workspace --features workflow --no-fail-fast -- --test-threads=1

      - name: Run clippy with budget feature
        run: cargo clippy --all --all-targets --features budget -- -D warnings

      - name: Run tests with budget feature
        run: cargo test --workspace --features budget --no-fail-fast -- --test-threads=1

      - name: Run clippy with workflow and budget features
        run: cargo clippy --all --all-targets --features workflow,budget -- -D warnings

      - name: Run tests with workflow and budget features
        run: cargo test --workspace --features workflow,budget --no-fail-fast -- --test-threads=1

      - name: Run clippy with actor feature
        run: cargo clippy --all --all-targets --features actor -- -D warnings

      - name: Run tests with actor feature
        run: cargo test --workspace --features actor --no-fail-fast -- --test-threads=1

      - name: Run clippy with platform feature
        run: cargo clippy --all --all-targets --features platform -- -D warnings

      - name: Run tests with platform feature
        run: cargo test --workspace --features platform --no-fail-fast -- --test-threads=1

      - name: Run clippy with actor and platform features
        run: cargo clippy --all --all-targets --features actor,platform -- -D warnings

      - name: Run tests with actor and platform features
        run: cargo test --workspace --features actor,platform --no-fail-fast -- --test-threads=1

      - name: Run clippy with all features
        run: cargo clippy --all --all-targets --features workflow,budget,actor,platform -- -D warnings

      - name: Run tests with all features
        run: cargo test --workspace --features workflow,budget,actor,platform --no-fail-fast -- --test-threads=1

      - name: Run actionqueue-storage serde roundtrip tests
        run: cargo test -p actionqueue-storage --features serde

  conformance-package:
    name: Versioned conformance evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-aq-conformance-${{ hashFiles('**/Cargo.lock') }}
      - name: Prepare controller-owned evidence directory
        run: mkdir -p "${{ runner.temp }}/aq-conformance"
      - name: Package, model, and acknowledged process cuts
        env:
          TMPDIR: ${{ runner.temp }}/aq-conformance
        run: cargo aq-conformance
      - name: Expanded developmental and two-store evidence
        env:
          TMPDIR: ${{ runner.temp }}/aq-conformance
        run: cargo aq-developmental
      - name: Complete conformance and public-driver report
        env:
          TMPDIR: ${{ runner.temp }}/aq-conformance
        run: cargo run --example aq_conformance --features workflow,budget,actor,platform -- --full --report "${{ runner.temp }}/aq-conformance/report.json"
      - name: Independent cross-feature persistence
        env:
          TMPDIR: ${{ runner.temp }}/aq-conformance
        run: bash conformance/aq-cont-1/cross-feature-persistence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aq-conformance-evidence
          path: |
            ${{ runner.temp }}/aq-conformance/report.json
            ${{ runner.temp }}/aq-conformance/aq-model-failure-*.json
            ${{ runner.temp }}/aq-conformance/aq-dd-*-report.json
            ${{ runner.temp }}/aq-conformance/aq-full-evidence-*/

  production-feature-builds:
    name: Production feature boundaries (${{ matrix.features || 'base' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ['', 'workflow', 'budget', 'workflow,budget', 'actor', 'platform', 'actor,platform', 'workflow,budget,actor,platform']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - name: Build independent production consumers without test feature unification
        run: |
          cargo build -p actionqueue-daemon --no-default-features --features '${{ matrix.features }}'
          cargo build -p actionqueue-cli --no-default-features --features '${{ matrix.features }}'

  continuation-performance:
    name: Continuation workload measurements and bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - name: Measure fixed workloads
        env:
          AQ_PERFORMANCE_REPORT: ${{ runner.temp }}/aq-performance.json
        run: cargo bench --bench continuation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aq-performance
          path: ${{ runner.temp }}/aq-performance.json

  release-readiness:
    name: Consumer, packages and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo fetch --locked
      - run: python3 -B -m unittest discover -s tests/release
      - run: cargo fmt --manifest-path examples/downstream-handoff/Cargo.toml -- --check
      - run: python3 -B scripts/check-consumer.py
      - run: python3 -B scripts/check-packages.py --output "${{ runner.temp }}/crates"
      - run: cargo doc --locked --workspace --no-deps --features workflow,budget,actor,platform
      - run: python3 -B scripts/check-docs.py --api target/doc
