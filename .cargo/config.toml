# Limit resource consumption to prevent OOM when multiple workspaces
# build/test concurrently (exoskeleton + worldinterface + observatory).
[build]
jobs = 8

[env]
RUST_TEST_THREADS = "4"

[alias]
# AQ-CONT-1 contract boundary, frozen-evidence, and pre-contract store checks.
# Prints the pinned contract and developmental-profile revisions (revision_report test).
aq-conformance = "test --test conformance_contract_boundaries --test conformance_frozen_evidence --test conformance_pre_contract_store --test conformance_target_persistence --test conformance_store_process_lock --test acceptance_dispatch_invariants --test acceptance_idempotent_admission --test acceptance_admission_conflict --test acceptance_compound_admission_crash --test acceptance_signal_admission --test acceptance_signal_retention --test acceptance_signal_crash --test acceptance_waits --test acceptance_wait_crash --test acceptance_checkpoint_resume --test acceptance_resume_context_crash --test acceptance_attempt_disposition --test acceptance_transactional_child_admission --test acceptance_parent_wait_child_atomicity --test acceptance_structural_inspection --test conformance_package --test conformance_scenarios --test conformance_model --test chaos_continuation_matrix -- --test-threads=1 --nocapture"

# Expanded developmental and two-store evidence. The full runner also requires all transports.
aq-developmental = "test --features workflow,budget,actor,platform --test conformance_developmental --test conformance_reference_adapter -- --test-threads=1 --nocapture"
